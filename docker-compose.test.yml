services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: stashstats-test-runner
    command: pytest tests/
    volumes:
      - .:/app:z
      - /app/.venv
    env_file:
      - .env
    environment:
      - CI=true
      - APP_DEBUG=true
      - REDIS_URL=redis://cache:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-stashstats}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-stashstats123}
      - MINIO_BUCKET=${MINIO_BUCKET:-stashstats-pdfs}
      - MINIO_SECURE=false
      - API_USERNAME=${DEV_USERNAME}
      - API_KEY=${DEV_API_KEY}
    depends_on:
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: stashstats-test-minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-stashstats}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-stashstats123}
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  cache:
    image: redis:7-alpine
    container_name: stashstats-test-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
