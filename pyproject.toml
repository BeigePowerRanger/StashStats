[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stashstats"
version = "0.1.0"
description = "StashStats - Ravelry Stash Analytics and Management Dash Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.2.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "watchdog>=3.0.0",
    "minio>=7.2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "faker>=20.0.0",
    "anyio>=4.0.0",
    "uv>=0.1.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stashstats*"]
exclude = ["tests*", "__pycache__*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade (Python 3.11+ modern syntax)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length violations handled by formatter
    "B008",   # function call in argument defaults (Dash / FastAPI / Pydantic patterns)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

